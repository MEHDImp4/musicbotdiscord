name: pulse

services:
  bot:
    build: .
    container_name: pulse
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    env_file:
      - .env.docker
    environment:
      - DATA_DIR=/data
    volumes:
      - .:/app
      - /app/node_modules
      - pulse-data:/data

volumes:
  pulse-data:
