name-template: "v$NEXT_PATCH_VERSION"
tag-template: "v$NEXT_PATCH_VERSION"

categories:
  - title: "🚀 Features"
    labels: ["enhancement", "feature"]
  - title: "🐛 Bug Fixes"
    labels: ["bug", "fix"]
  - title: "🐳 Docker & CI"
    labels: ["docker", "ci"]
  - title: "📝 Documentation"
    labels: ["documentation"]
  - title: "⬆️ Dependencies"
    labels: ["dependencies"]

change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&'

template: |
  ## What's changed

  $CHANGES

  **Full Changelog**: https://github.com/MEHDImp4/pulse/commits/$NEXT_PATCH_VERSION
