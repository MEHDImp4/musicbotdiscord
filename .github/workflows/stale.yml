name: Stale

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Mark and close stale items
        uses: actions/stale@v9
        with:
          days-before-stale: 30
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >-
            Cette issue est inactive depuis 30 jours. Elle sera fermée dans 14 jours
            si aucun nouveau commentaire n'est ajouté.
          stale-pr-message: >-
            Cette pull request est inactive depuis 30 jours. Elle sera fermée dans 14 jours
            si aucune nouvelle activité n'a lieu.
          close-issue-message: "Fermée automatiquement pour inactivité. Rouvre-la si besoin."
          close-pr-message: "Fermée automatiquement pour inactivité. Rouvre-la si besoin."
          exempt-issue-labels: "pinned,security,good first issue,help wanted,status: blocked"
          exempt-pr-labels: "pinned,security,status: blocked"
